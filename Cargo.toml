[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gtk"]
# The GTK app needs the GTK 4 development files. Build it explicitly with
# `cargo build -p roxora-hwtool-gtk`; plain `cargo build` and `cargo test`
# cover the core library and the CLI only.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-2.0-only"
authors = ["Ga Hing Woo <gahing@gahingwoo.com>"]
repository = "https://github.com/roxora-os/hwtool"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
